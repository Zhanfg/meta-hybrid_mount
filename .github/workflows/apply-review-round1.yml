name: Apply Review Round 1 Fixes

on:
  push:
    branches:
      - 'review/triple-code-review'
    paths:
      - '.github/workflows/apply-review-round1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: review/triple-code-review
          fetch-depth: 0

      - name: Apply reviewed fixes
        shell: bash
        run: |
          echo '  TUl fTEtNX01PRFVMRV9OQU1FK      bW9kIHRlc3RzIHsKICAgIHVzZSBzdXBlcjo6cGFyc2Vfa21pX2Zyb21fcmVsZWFzZTsKJycnLAogICAgJycn bW9kIHRlc3RzIHsKICAgIHVzZSBzdXBlcjo6e2xvYWRlZF9tb2R1bGVfbmFtZV9mcm9tX3Byb2NfbW9kdWxlcywgcGFyc2Vfa21pX2Zyb21fcmVsZWFzZX07CicnJwopCnJlcGxhY2Vfb25jZSgKICAgIGxr  ' | tr -d ' ' | base64 -d > /tmp/apply_round1.py
          python3 /tmp/apply_round1.py
          cargo fmt --all
          git diff --check
          cargo test --workspace --all-features
          cargo test -p hybrid-mount --no-default-features --features control-plane --lib
          cargo test -p hybrid-mount --no-default-features --lib

      - name: Commit round-one fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sys/kasumi.rs src/sys/lkm.rs src/mount/kasumi/status.rs src/core/api/kasumi.rs
          git commit -m 'fix: preserve protocol-16 runtime detection and LKM ownership'
          git push origin HEAD:review/triple-code-review
