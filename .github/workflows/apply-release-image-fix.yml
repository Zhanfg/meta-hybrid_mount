name: Apply Release Image Fix

on:
  push:
    branches:
      - 'fix/restore-full-kasumi'
    paths:
      - '.github/workflows/apply-release-image-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restore-full-kasumi
          fetch-depth: 0
      - name: Point release jobs to fork-local CI image
        run: |
          set -euo pipefail
          sed -i 's#ghcr.io/hybrid-mount/meta-hybrid_mount-ci:latest#ghcr.io/zhanfg/meta-hybrid_mount-ci:latest#g' .github/workflows/release.yml
          test "$(grep -c 'ghcr.io/zhanfg/meta-hybrid_mount-ci:latest' .github/workflows/release.yml)" -eq 2
          test "$(grep -c 'ghcr.io/hybrid-mount/meta-hybrid_mount-ci:latest' .github/workflows/release.yml || true)" -eq 0
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml
          git diff --cached --check
          git commit -m 'ci: use the fork-local image for releases'
          git push origin HEAD:fix/restore-full-kasumi
