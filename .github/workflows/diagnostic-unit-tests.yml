# Temporary review-only diagnostic workflow. Remove before final freeze.
name: diagnostic-unit-tests
on:
  push:
    branches:
      - review/flash-safety-20260807

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  capture:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zhanfg/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          filter: 'tree:0'
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Capture full unit test output
        shell: bash
        run: |
          set +e
          cargo test --workspace --all-features -- --nocapture 2>&1 | tee unit-test-output.txt
          printf '%s\n' "${PIPESTATUS[0]}" > unit-test-status.txt
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-diagnostic-${{ github.sha }}
          path: |
            unit-test-output.txt
            unit-test-status.txt
          if-no-files-found: error
