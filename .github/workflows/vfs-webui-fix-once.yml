name: VFS WebUI fixes once

on:
  push:
    branches:
      - 'integration/vfs-nomount-20260809'
    paths:
      - '.github/workflows/vfs-webui-fix-once.yml'

permissions:
  contents: write
  packages: read

jobs:
  patch-once:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zhanfg/meta-hybrid_mount-ci@sha256:c7df09521257f5b5e78e20ffa4928eb5ec905fa324523a36723f625b496b8e22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/vfs-nomount-20260809
          fetch-depth: 0
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Apply exact compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} exact matches, found {count}")
              p.write_text(text.replace(old, new, expected))

          replace(
              "webui/src/lib/constants.ts",
              '  default_mode: "overlay",\n  custom_mounts: [],',
              '  default_mode: "overlay",\n  vfs: { enabled: false, backend: "auto", max_branches: 5 },\n  custom_mounts: [],',
          )

          replace(
              "webui/src/lib/stores/moduleStore.ts",
              '    const stats: ModeStats = {\n      overlay: 0,',
              '    const stats: ModeStats = {\n      vfs: 0,\n      overlay: 0,',
          )

          replace(
              "webui/src/lib/api.mock.ts",
              'function buildModeStats(): ModeStats {\n  return {\n    overlay: 1,',
              'function buildModeStats(): ModeStats {\n  return {\n    vfs: 0,\n    overlay: 1,',
          )
          replace(
              "webui/src/lib/api.mock.ts",
              '    mount_point: "/data/adb/hybrid-mount/mnt",\n    overlay_modules:',
              '    mount_point: "/data/adb/hybrid-mount/mnt",\n    vfs_modules: [],\n    vfs_backend: null,\n    vfs_fallback_modules: [],\n    overlay_modules:',
          )
          replace(
              "webui/src/lib/api.mock.ts",
              '      overlayfs_mounts: 1,\n      ignored_entries:',
              '      overlayfs_mounts: 1,\n      vfs_mounts: 0,\n      ignored_entries:',
          )
          replace(
              "webui/src/lib/api.mock.ts",
              '    mode_stats: {\n      overlayfs:',
              '    mode_stats: {\n      vfs: 0,\n      overlayfs:',
          )
          replace(
              "webui/src/lib/api.mock.ts",
              '      modeStats: buildModeStats(),\n      mountedCount: 3,',
              '      modeStats: buildModeStats(),\n      mountedCount: 3,\n      vfsBackend: null,\n      vfsFallbackCount: 0,',
          )

          replace(
              "webui/src/lib/api/schemas.ts",
              '    vfs: vfsConfigSchema,',
              '    vfs: vfsConfigSchema.optional(),',
          )
          replace(
              "webui/src/lib/api/schemas.ts",
              '    kasumi: kasumiConfigSchema,',
              '    kasumi: kasumiConfigSchema.optional(),',
          )

          p = Path("webui/src/lib/api/codec/configCodec.ts")
          p.write_text('''/*\n * Copyright (C) 2026 YuzakiKokuban <heibanbaize@gmail.com>\n *\n * Licensed under the Apache License, Version 2.0 (the "License");\n */\n\nimport { DEFAULT_CONFIG } from "../../constants";\nimport type { AppConfig } from "../../types";\nimport { appConfigSchema } from "../schemas";\n\nfunction defaultKasumi(): AppConfig["kasumi"] {\n  return {\n    ...DEFAULT_CONFIG.kasumi,\n    mount_hide: { ...DEFAULT_CONFIG.kasumi.mount_hide },\n    statfs_spoof: { ...DEFAULT_CONFIG.kasumi.statfs_spoof },\n    hide_uids: [...DEFAULT_CONFIG.kasumi.hide_uids],\n    uname: { ...DEFAULT_CONFIG.kasumi.uname },\n    kstat_rules: [...DEFAULT_CONFIG.kasumi.kstat_rules],\n    maps_rules: [...DEFAULT_CONFIG.kasumi.maps_rules],\n  };\n}\n\nexport function normalizeConfig(value: unknown): AppConfig {\n  const parsed = appConfigSchema.parse(value);\n  return {\n    ...parsed,\n    vfs: parsed.vfs ?? { ...DEFAULT_CONFIG.vfs },\n    kasumi: parsed.kasumi ?? defaultKasumi(),\n  } as AppConfig;\n}\n''')

          p = Path("webui/src/lib/api/services/systemService.ts")
          text = p.read_text()
          if 'import { normalizeConfig } from "../codec/configCodec";' not in text:
              needle = 'import { buildModeStats, buildMountedCount } from "../codec/runtimeCodec";\n'
              if text.count(needle) != 1:
                  raise SystemExit("systemService import anchor mismatch")
              text = text.replace(needle, needle + 'import { normalizeConfig } from "../codec/configCodec";\n')
          old = '    config: payload.config,\n'
          if text.count(old) != 1:
              raise SystemExit("systemService config anchor mismatch")
          text = text.replace(old, '    config: normalizeConfig(payload.config),\n')
          p.write_text(text)
          PY
      - name: Commit exact patch set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui/src/lib/constants.ts webui/src/lib/stores/moduleStore.ts webui/src/lib/api.mock.ts webui/src/lib/api/schemas.ts webui/src/lib/api/codec/configCodec.ts webui/src/lib/api/services/systemService.ts
          git diff --cached --check
          git commit -m "fix: complete VFS WebUI compatibility model"
          git push origin HEAD:integration/vfs-nomount-20260809
