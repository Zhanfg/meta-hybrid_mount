# Fork validation pins the audited Kasumi API 17 commit and fork-local CI image.

name: Build Hybrid-Mount

on:
  push:
    branches:
      - 'dev'
      - 'fix/**'
      - 'review/**'
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'module/**'
      - 'webui'
      - 'webui/**'
      - 'xtask/**'
      - 'tests/**'
      - 'build.rs'
      - 'scripts/build-local.sh'
      - 'scripts/check-kasumi-uapi-compat.sh'
      - 'tools/notify/**'
      - '.github/workflows/build-kasumi-lkm.yml'
      - '.github/workflows/kasumi-lkm.yml'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - 'dev'
    paths:
      - 'src/**'
      - 'Cargo.*'
      - 'module/**'
      - 'webui'
      - 'webui/**'
      - 'xtask/**'
      - 'tests/**'
      - 'build.rs'
      - 'scripts/build-local.sh'
      - 'scripts/check-kasumi-uapi-compat.sh'
      - 'tools/notify/**'
      - '.github/workflows/build-kasumi-lkm.yml'
      - '.github/workflows/kasumi-lkm.yml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build-kasumi-lkm:
    uses: ./.github/workflows/build-kasumi-lkm.yml
    secrets: inherit
    with:
      kasumi_repo: Zhanfg/Kasumi
      kasumi_ref: 4aab6b519dadae6f43776f66a208ea5ae0fc8a3e

  build:
    needs: [build-kasumi-lkm]
    name: Build ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, lite, nano]
    container:
      image: ghcr.io/zhanfg/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: 'tree:0'

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check Kasumi protocol 16/17 ABI
        run: bash scripts/check-kasumi-uapi-compat.sh

      - name: Download Kasumi LKM artifacts
        uses: actions/download-artifact@v8
        with:
          path: kasumi_lkm_artifacts
          pattern: "*-kasumi-lkm"
          merge-multiple: true

      - name: Download Kasumi UAPI
        uses: actions/download-artifact@v8
        with:
          name: kasumi-uapi
          path: kasumi_uapi_artifact

      - name: Verify Kasumi UAPI lockstep
        run: |
          set -euo pipefail
          mapfile -t UAPI_FILES < <(find kasumi_uapi_artifact -type f -name kasumi_uapi.h | sort)
          if [ "${#UAPI_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one kasumi_uapi.h artifact, found ${#UAPI_FILES[@]}:"
            find kasumi_uapi_artifact -type f -print | sort
            exit 1
          fi
          if ! cmp -s "${UAPI_FILES[0]}" src/sys/kasumi_uapi.h; then
            echo "Bundled userspace UAPI does not match the pinned Kasumi kernel source."
            diff -u src/sys/kasumi_uapi.h "${UAPI_FILES[0]}" || true
            exit 1
          fi
          sha256sum src/sys/kasumi_uapi.h "${UAPI_FILES[0]}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Build ${{ matrix.flavor }}
        env:
          HYBRID_MOUNT_NOTIFY: "0"
          HYBRID_MOUNT_KASUMI_LKM_DIR: ${{ github.workspace }}/kasumi_lkm_artifacts
        run: |
          set -euo pipefail
          ls -la "$HYBRID_MOUNT_KASUMI_LKM_DIR" || true
          rm -rf output
          cargo xtask build --ci --flavor ${{ matrix.flavor }}

          ZIP_PATH="$(find output -maxdepth 1 -type f -name '*.zip' | sort | head -n 1)"
          test -n "$ZIP_PATH"
          ZIP_FILENAME="$(basename "$ZIP_PATH")"
          ARTIFACT_NAME="${ZIP_FILENAME%.*}"
          echo "ARTIFACT_ZIP=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Validate ${{ matrix.flavor }} package
        env:
          BUILD_FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          test -n "${ARTIFACT_ZIP:-}"
          unzip -tqq "$ARTIFACT_ZIP"

          if unzip -Z1 "$ARTIFACT_ZIP" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Archive contains an unsafe path."
            unzip -Z1 "$ARTIFACT_ZIP"
            exit 1
          fi

          STAGE_DIR="$(mktemp -d)"
          trap 'rm -rf "$STAGE_DIR"' EXIT
          unzip -qq "$ARTIFACT_ZIP" -d "$STAGE_DIR"

          test -s "$STAGE_DIR/module.prop"
          test -s "$STAGE_DIR/config.toml"
          test -s "$STAGE_DIR/binaries/hybrid-mount"
          grep -Fx 'id=hybrid_mount' "$STAGE_DIR/module.prop"
          grep -Eq '^version=4\.2\.0-[0-9]+$' "$STAGE_DIR/module.prop"
          grep -Eq '^versionCode=1[0-9]{9}$' "$STAGE_DIR/module.prop"
          grep -Fx 'metamodule=1' "$STAGE_DIR/module.prop"
          if grep -q '^updateJson=' "$STAGE_DIR/module.prop"; then
            echo "Fork development artifact unexpectedly contains updateJson."
            exit 1
          fi

          while IFS= read -r -d '' script; do
            sh -n "$script"
          done < <(find "$STAGE_DIR" -maxdepth 1 -type f -name '*.sh' -print0 | sort -z)

          file "$STAGE_DIR/binaries/hybrid-mount" | grep -Eq 'ELF 64-bit.*ARM aarch64'

          case "$BUILD_FLAVOR" in
            full)
              grep -Fx 'name=Hybrid Mount Fork' "$STAGE_DIR/module.prop"
              grep -Fx 'webuiIcon=launcher.png' "$STAGE_DIR/module.prop"
              test -d "$STAGE_DIR/webroot"
              test -s "$STAGE_DIR/launcher.png"
              test -d "$STAGE_DIR/kasumi_lkm"
              LKM_COUNT="$(find "$STAGE_DIR/kasumi_lkm" -maxdepth 1 -type f -name '*.ko' | wc -l | tr -d ' ')"
              test "$LKM_COUNT" -eq 7
              test ! -e "$STAGE_DIR/.nano"
              ;;
            lite)
              grep -Fx 'name=Hybrid Mount Fork Lite' "$STAGE_DIR/module.prop"
              grep -Fx 'webuiIcon=launcher.png' "$STAGE_DIR/module.prop"
              test -d "$STAGE_DIR/webroot"
              test -s "$STAGE_DIR/launcher.png"
              test ! -e "$STAGE_DIR/kasumi_lkm"
              test ! -e "$STAGE_DIR/.nano"
              ;;
            nano)
              grep -Fx 'name=Hybrid Mount Fork Nano' "$STAGE_DIR/module.prop"
              test -f "$STAGE_DIR/.nano"
              test ! -e "$STAGE_DIR/webroot"
              test ! -e "$STAGE_DIR/launcher.png"
              test ! -e "$STAGE_DIR/kasumi_lkm"
              if grep -q '^webuiIcon=' "$STAGE_DIR/module.prop"; then
                echo "Nano artifact unexpectedly declares a WebUI icon."
                exit 1
              fi
              ;;
            *)
              echo "Unknown build flavor: $BUILD_FLAVOR"
              exit 1
              ;;
          esac

          sha256sum "$ARTIFACT_ZIP"

      - name: Upload ${{ matrix.flavor }} Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_ZIP }}
          compression-level: 0
          if-no-files-found: error

  notify:
    needs: build
    if: github.event_name != 'pull_request'
    name: Notify packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: 'tree:0'

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: notify-output
          pattern: Hybrid-Mount-*
          merge-multiple: true

      - name: Notify Telegram album
        env:
          HYBRID_MOUNT_NOTIFY: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          mapfile -t ZIP_FILES < <(find notify-output -maxdepth 1 -type f -name '*.zip' | sort)
          if [ "${#ZIP_FILES[@]}" -ne 3 ]; then
            echo "Expected 3 package artifacts, found ${#ZIP_FILES[@]}:"
            find notify-output -maxdepth 2 -type f -print | sort
            exit 1
          fi
          cargo xtask notify \
            --output notify-output \
            --label "日常耕作 🌱 (Daily Tilling) [full+lite+nano] - ${{ github.ref_name }}" \
            --topic-id 37
