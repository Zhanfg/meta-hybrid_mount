name: Apply Cross-Review Reconciliation

on:
  push:
    branches:
      - 'review/triple-code-review-reconciled'
    paths:
      - '.github/workflows/apply-reconciliation.yml'

permissions:
  contents: write
  packages: read

jobs:
  apply:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zhanfg/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: review/triple-code-review-reconciled
          fetch-depth: 0

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Apply and verify reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_reconciliation.py
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          sh -n scripts/check-kasumi-uapi-compat.sh
          bash scripts/check-kasumi-uapi-compat.sh
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy -p hybrid-mount --no-default-features --features control-plane --lib -- -D warnings
          cargo clippy -p hybrid-mount --no-default-features --lib -- -D warnings
          cargo test --workspace --all-features
          cargo test -p hybrid-mount --no-default-features --features control-plane --lib
          cargo test -p hybrid-mount --no-default-features --lib
          cd webui
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run test

      - name: Commit reconciled fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/ops/prepare/coordinator.rs src/mount/kasumi/runtime.rs src/core/ops/executor/mod.rs src/core/api/kasumi.rs tests/kasumi_uapi_compat.c
          git commit -m 'fix: reconcile effective fallback and complete runtime rollback'
          git push origin HEAD:review/triple-code-review-reconciled
