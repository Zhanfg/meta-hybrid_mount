name: Export Repair Sources

on:
  push:
    branches:
      - 'fix/restore-full-kasumi'
    paths:
      - '.github/workflows/export-repair-sources.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v7
        with:
          name: repair-sources
          path: |
            src/sys/kasumi.rs
            src/mount/kasumi/runtime.rs
            src/conf/schema.rs
          if-no-files-found: error
