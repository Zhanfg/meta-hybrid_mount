name: Retry Review Round 1

on:
  push:
    branches:
      - 'review/triple-code-review'
    paths:
      - '.github/workflows/retry-review-round1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: review/triple-code-review
          fetch-depth: 0

      - name: Reapply corrected reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          workflow = Path('.github/workflows/apply-review-round1.yml').read_text()
          match = re.search(r"echo '([^']+)' \| tr -d ' ' \| base64 -d", workflow)
          if not match:
              raise SystemExit('encoded round-one patch not found')
          script = base64.b64decode(match.group(1).replace(' ', '')).decode()
          script = script.replace('error={#?}', 'error={:#}')
          Path('/tmp/apply_round1.py').write_text(script)
          PY
          python3 /tmp/apply_round1.py
          cargo fmt --all
          git diff --check
          cargo test --workspace --all-features
          cargo test -p hybrid-mount --no-default-features --features control-plane --lib
          cargo test -p hybrid-mount --no-default-features --lib

      - name: Commit round-one fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sys/kasumi.rs src/sys/lkm.rs src/mount/kasumi/status.rs src/core/api/kasumi.rs
          git commit -m 'fix: preserve protocol-16 runtime detection and LKM ownership'
          git push origin HEAD:review/triple-code-review
