name: Build Fork CI Image

on:
  push:
    branches:
      - 'fix/**'
    paths:
      - '.github/docker/ci/Dockerfile'
      - '.github/workflows/ci-image-fork.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          filter: 'tree:0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/ci/Dockerfile
          push: true
          tags: |
            ghcr.io/zhanfg/meta-hybrid_mount-ci:latest
            ghcr.io/zhanfg/meta-hybrid_mount-ci:${{ github.sha }}
          cache-from: type=gha,scope=hybrid-mount-ci-image
          cache-to: type=gha,scope=hybrid-mount-ci-image,mode=max
