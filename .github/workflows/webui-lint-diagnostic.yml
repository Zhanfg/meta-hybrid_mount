name: WebUI lint diagnostic

on:
  push:
    branches:
      - 'integration/vfs-nomount-20260809'
    paths:
      - '.github/workflows/webui-lint-diagnostic.yml'

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zhanfg/meta-hybrid_mount-ci@sha256:c7df09521257f5b5e78e20ffa4928eb5ec905fa324523a36723f625b496b8e22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v7
      - run: pnpm install --frozen-lockfile
      - name: Capture lint output
        shell: bash
        run: |
          set +e
          pnpm lint 2>&1 | tee /tmp/webui-lint.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > /tmp/webui-lint.rc
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: webui-lint-diagnostic
          path: |
            /tmp/webui-lint.log
            /tmp/webui-lint.rc
          if-no-files-found: error
