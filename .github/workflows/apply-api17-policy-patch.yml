name: Apply API 17 Policy Patch

on:
  push:
    branches:
      - 'fix/restore-full-kasumi'
    paths:
      - 'scripts/apply-api17-policy-patch.py'
      - '.github/workflows/apply-api17-policy-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restore-full-kasumi
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: python3 scripts/apply-api17-policy-patch.py
      - name: Format Rust source
        run: cargo fmt -- src/sys/kasumi.rs
      - name: Commit patched source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sys/kasumi.rs
          git diff --cached --check
          git commit -m "fix: migrate hide UID handling to Kasumi API 17"
          git push origin HEAD:fix/restore-full-kasumi
