name: Apply Kasumi Clippy Fix

on:
  push:
    branches:
      - 'fix/restore-full-kasumi'
    paths:
      - '.github/workflows/apply-kasumi-clippy-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/restore-full-kasumi
          fetch-depth: 0
      - name: Reset to the latest remote head
        run: |
          git fetch origin fix/restore-full-kasumi
          git reset --hard origin/fix/restore-full-kasumi
      - name: Remove redundant bindgen casts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/sys/kasumi.rs')
          text = path.read_text()
          names = [
              'KSM_POLICY_API_VERSION',
              'KSM_POLICY_OWNER_AUTO',
              'KSM_POLICY_OWNER_MANUAL',
              'KSM_POLICY_FLAG_USE_ALLOW_UIDS',
              'KSM_POLICY_UID_LIST_ALLOW',
              'KSM_POLICY_UID_LIST_ALL',
          ]
          for name in names:
              old = f'uapi::{name} as u32'
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: expected one redundant cast')
              text = text.replace(old, f'uapi::{name}', 1)
          path.write_text(text)
          PY
          cargo fmt -- src/sys/kasumi.rs
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sys/kasumi.rs
          git diff --cached --check
          git commit -m 'fix: remove redundant API 17 constant casts'
          git push origin HEAD:fix/restore-full-kasumi
