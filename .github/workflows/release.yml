name: Release Hybrid-Mount

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: read

jobs:
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag, source version and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Unsupported release tag: $TAG"
            exit 1
          fi

          TAG_VERSION="${TAG#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$CARGO_VERSION" ] || [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "Release blocked: tag version $TAG_VERSION does not match Cargo.toml version ${CARGO_VERSION:-<missing>}."
            echo "Bump and validate the source version on main before creating the tag."
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release blocked: tagged commit $GITHUB_SHA is not contained in origin/main."
            echo "Merge and validate the candidate before creating the release tag."
            exit 1
          fi

  build-kasumi-lkm:
    needs: release-preflight
    uses: ./.github/workflows/build-kasumi-lkm.yml
    secrets: inherit
    with:
      kasumi_repo: Zhanfg/Kasumi
      kasumi_ref: 4aab6b519dadae6f43776f66a208ea5ae0fc8a3e

  build:
    needs: [release-preflight, build-kasumi-lkm]
    name: Build ${{ matrix.flavor }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, lite, nano]
    container:
      image: ghcr.io/zhanfg/meta-hybrid_mount-ci@sha256:c7df09521257f5b5e78e20ffa4928eb5ec905fa324523a36723f625b496b8e22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: 'tree:0'

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check Kasumi protocol 16/17 ABI
        run: bash scripts/check-kasumi-uapi-compat.sh

      - name: Download Kasumi LKM artifacts
        uses: actions/download-artifact@v8
        with:
          path: kasumi_lkm_artifacts
          pattern: "*-kasumi-lkm"
          merge-multiple: true

      - name: Download Kasumi UAPI
        uses: actions/download-artifact@v8
        with:
          name: kasumi-uapi
          path: kasumi_uapi_artifact

      - name: Verify Kasumi UAPI lockstep
        run: |
          set -euo pipefail
          mapfile -t UAPI_FILES < <(find kasumi_uapi_artifact -type f -name kasumi_uapi.h | sort)
          if [ "${#UAPI_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one kasumi_uapi.h artifact, found ${#UAPI_FILES[@]}."
            find kasumi_uapi_artifact -type f -print | sort
            exit 1
          fi
          if ! cmp -s "${UAPI_FILES[0]}" src/sys/kasumi_uapi.h; then
            echo "Bundled userspace UAPI does not match the pinned Kasumi kernel source."
            diff -u src/sys/kasumi_uapi.h "${UAPI_FILES[0]}" || true
            exit 1
          fi

      - name: Configure release update channel
        env:
          BUILD_FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main"
          case "$BUILD_FLAVOR" in
            full)
              sed -i "s|^update = \".*\"|update = \"$RAW_BASE/update.json\"|" Cargo.toml
              ;;
            lite)
              sed -i "s|^lite_update = \".*\"|lite_update = \"$RAW_BASE/update-lite.json\"|" Cargo.toml
              ;;
            nano)
              sed -i "s|^nano_update = \".*\"|nano_update = \"$RAW_BASE/update-nano.json\"|" Cargo.toml
              ;;
            *)
              echo "Unknown build flavor: $BUILD_FLAVOR"
              exit 1
              ;;
          esac

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Build ${{ matrix.flavor }}
        env:
          HYBRID_MOUNT_NOTIFY: "0"
          HYBRID_MOUNT_SIGN_KEY: ${{ secrets.SIGNING_KEY }}
          HYBRID_MOUNT_SIGN_CERT: ${{ secrets.SIGNING_CERT }}
          HYBRID_MOUNT_KASUMI_LKM_DIR: ${{ github.workspace }}/kasumi_lkm_artifacts
        run: |
          set -euo pipefail
          rm -rf output
          cargo xtask build --release --tag "${GITHUB_REF_NAME}" --flavor "${{ matrix.flavor }}"

          ZIP_PATH="$(find output -maxdepth 1 -type f -name '*.zip' | sort | head -n 1)"
          test -n "$ZIP_PATH"
          test -s "$ZIP_PATH"
          ZIP_FILENAME="$(basename "$ZIP_PATH")"
          STAGED_ZIP="/tmp/$ZIP_FILENAME"
          cp "$ZIP_PATH" "$STAGED_ZIP"
          echo "STAGED_ZIP=$STAGED_ZIP" >> "$GITHUB_ENV"

      - name: Validate ${{ matrix.flavor }} package
        env:
          BUILD_FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          test -n "${STAGED_ZIP:-}"
          test -s "$STAGED_ZIP"
          unzip -tqq "$STAGED_ZIP"

          if unzip -Z1 "$STAGED_ZIP" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "Release archive contains an unsafe path."
            unzip -Z1 "$STAGED_ZIP"
            exit 1
          fi

          STAGE_DIR="$(mktemp -d)"
          trap 'rm -rf "$STAGE_DIR"' EXIT
          unzip -qq "$STAGED_ZIP" -d "$STAGE_DIR"

          test -s "$STAGE_DIR/module.prop"
          test -s "$STAGE_DIR/package-integrity.sh"
          test -s "$STAGE_DIR/binaries/hybrid-mount"
          grep -Fx 'id=hybrid_mount' "$STAGE_DIR/module.prop"
          grep -Eq '^versionCode=1[0-9]{9}$' "$STAGE_DIR/module.prop"
          grep -Fx 'metamodule=1' "$STAGE_DIR/module.prop"
          file "$STAGE_DIR/binaries/hybrid-mount" | grep -Eq 'ELF 64-bit.*ARM aarch64'

          case "$BUILD_FLAVOR" in
            full) EXPECTED_UPDATE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/update.json" ;;
            lite) EXPECTED_UPDATE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/update-lite.json" ;;
            nano) EXPECTED_UPDATE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/update-nano.json" ;;
          esac
          grep -Fx "updateJson=$EXPECTED_UPDATE" "$STAGE_DIR/module.prop"

          (
            cd "$STAGE_DIR"
            # shellcheck source=/dev/null
            . ./package-integrity.sh
            rehybird_validate_package_tree "$PWD"
            if [ "${REHYBIRD_PACKAGE_FLAVOR:-}" != "$BUILD_FLAVOR" ]; then
              echo "Release package flavor mismatch: expected=$BUILD_FLAVOR actual=${REHYBIRD_PACKAGE_FLAVOR:-unknown}"
              exit 1
            fi
          )

          sha256sum "$STAGED_ZIP"

      - name: Upload ${{ matrix.flavor }} Artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.flavor }}
          path: ${{ env.STAGED_ZIP }}
          compression-level: 0
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    container:
      image: ghcr.io/zhanfg/meta-hybrid_mount-ci@sha256:c7df09521257f5b5e78e20ffa4928eb5ec905fa324523a36723f625b496b8e22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: package-*
          merge-multiple: true

      - name: Resolve and verify packages
        id: paths
        run: |
          set -euo pipefail
          FULL_ZIP="$(find packages -maxdepth 1 -type f -name '*.zip' ! -name '*-Lite-*' ! -name '*-Nano-*' | sort | head -n 1)"
          LITE_ZIP="$(find packages -maxdepth 1 -type f -name '*-Lite-*' | sort | head -n 1)"
          NANO_ZIP="$(find packages -maxdepth 1 -type f -name '*-Nano-*' | sort | head -n 1)"
          test -n "$FULL_ZIP" && test -s "$FULL_ZIP"
          test -n "$LITE_ZIP" && test -s "$LITE_ZIP"
          test -n "$NANO_ZIP" && test -s "$NANO_ZIP"

          read_version_code() {
            unzip -p "$1" module.prop | sed -n 's/^versionCode=//p' | head -n 1
          }
          FULL_VERSION_CODE="$(read_version_code "$FULL_ZIP")"
          LITE_VERSION_CODE="$(read_version_code "$LITE_ZIP")"
          NANO_VERSION_CODE="$(read_version_code "$NANO_ZIP")"

          if [[ ! "$FULL_VERSION_CODE" =~ ^1[0-9]{9}$ ]]; then
            echo "Invalid fork versionCode: $FULL_VERSION_CODE"
            exit 1
          fi
          if [ "$FULL_VERSION_CODE" != "$LITE_VERSION_CODE" ] || [ "$FULL_VERSION_CODE" != "$NANO_VERSION_CODE" ]; then
            echo "Flavor versionCode mismatch: full=$FULL_VERSION_CODE lite=$LITE_VERSION_CODE nano=$NANO_VERSION_CODE"
            exit 1
          fi

          sha256sum "$FULL_ZIP" "$LITE_ZIP" "$NANO_ZIP" | tee SHA256SUMS.txt

          echo "full_zip=$FULL_ZIP" >> "$GITHUB_OUTPUT"
          echo "lite_zip=$LITE_ZIP" >> "$GITHUB_OUTPUT"
          echo "nano_zip=$NANO_ZIP" >> "$GITHUB_OUTPUT"
          echo "full_name=$(basename "$FULL_ZIP")" >> "$GITHUB_OUTPUT"
          echo "lite_name=$(basename "$LITE_ZIP")" >> "$GITHUB_OUTPUT"
          echo "nano_name=$(basename "$NANO_ZIP")" >> "$GITHUB_OUTPUT"
          echo "version_code=$FULL_VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Metadata
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          TAG="$GITHUB_REF_NAME"
          VERSION_CODE="${{ steps.paths.outputs.version_code }}"
          FULL_NAME="${{ steps.paths.outputs.full_name }}"
          LITE_NAME="${{ steps.paths.outputs.lite_name }}"
          NANO_NAME="${{ steps.paths.outputs.nano_name }}"

          FULL_DOWNLOAD_URL="https://github.com/$REPO/releases/download/$TAG/$FULL_NAME"
          LITE_DOWNLOAD_URL="https://github.com/$REPO/releases/download/$TAG/$LITE_NAME"
          NANO_DOWNLOAD_URL="https://github.com/$REPO/releases/download/$TAG/$NANO_NAME"
          CHANGELOG_URL="https://raw.githubusercontent.com/$REPO/main/changelog.md"

          cat <<EOF > /tmp/update.json
          {
            "version": "$TAG",
            "versionCode": $VERSION_CODE,
            "zipUrl": "$FULL_DOWNLOAD_URL",
            "changelog": "$CHANGELOG_URL"
          }
          EOF

          cat <<EOF > /tmp/update-lite.json
          {
            "version": "$TAG",
            "versionCode": $VERSION_CODE,
            "zipUrl": "$LITE_DOWNLOAD_URL",
            "changelog": "$CHANGELOG_URL"
          }
          EOF

          cat <<EOF > /tmp/update-nano.json
          {
            "version": "$TAG",
            "versionCode": $VERSION_CODE,
            "zipUrl": "$NANO_DOWNLOAD_URL",
            "changelog": "$CHANGELOG_URL"
          }
          EOF

      - name: Ensure jq for git-cliff
        run: |
          set -euo pipefail
          if command -v jq >/dev/null 2>&1; then
            exit 0
          fi
          apt-get update
          apt-get install -y --no-install-recommends jq
          rm -rf /var/lib/apt/lists/*

      - name: Generate Changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current
          github_token: ${{ github.token }}
        env:
          OUTPUT: /tmp/changelog.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Sync release metadata to main
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main

          mv /tmp/update.json update.json
          mv /tmp/update-lite.json update-lite.json
          mv /tmp/update-nano.json update-nano.json
          cat /tmp/changelog.md | cat - changelog.md > temp && mv temp changelog.md

          git add update.json update-lite.json update-nano.json changelog.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): sync metadata for ${GITHUB_REF_NAME} [skip ci]"
            git push origin main
          fi

      - name: Create local GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.paths.outputs.full_zip }}
            ${{ steps.paths.outputs.lite_zip }}
            ${{ steps.paths.outputs.nano_zip }}
            SHA256SUMS.txt
          body_path: /tmp/changelog.md
