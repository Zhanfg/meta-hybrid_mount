name: Fix Kasumi Compatibility Comment

on:
  push:
    branches:
      - 'fix/kasumi-protocol16-17'
    paths:
      - '.github/workflows/fix-kasumi-comment.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/kasumi-protocol16-17
          fetch-depth: 0

      - name: Correct protocol dispatch documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/sys/kasumi.rs')
          text = path.read_text()
          old = '''/// Configure the legacy `hide_uids` setting through protocol 17's manual
/// policy API. Protocol 17 still defines ioctl 21 for source compatibility,
/// but no longer dispatches it. An explicit Hybrid Mount UID list means
/// exactly those UIDs receive Kasumi's managed view, so map it to MANUAL +
/// ALLOW instead of silently receiving `EINVAL` from the obsolete request.
'''
          new = '''/// Configure the legacy `hide_uids` setting through the ABI selected at
/// runtime. Protocol 16 dispatches ioctl 21 directly. Protocol 17 keeps that
/// request only for source compatibility, so explicit UIDs are translated to
/// its MANUAL + ALLOW policy API instead of receiving `EINVAL`.
'''
          if text.count(old) != 1:
              raise SystemExit('expected one legacy comment block')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git diff --check

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sys/kasumi.rs
          git commit -m 'docs: clarify Kasumi protocol-specific UID dispatch'
          git push origin HEAD:fix/kasumi-protocol16-17
