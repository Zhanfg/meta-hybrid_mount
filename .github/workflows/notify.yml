name: Notify crate

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'tools/notify/**'
      - '.github/workflows/notify.yml'
  push:
    branches:
      - '**'
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'tools/notify/**'
      - '.github/workflows/notify.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always

jobs:
  notify:
    name: Notify crate
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zhanfg/meta-hybrid_mount-ci@sha256:c7df09521257f5b5e78e20ffa4928eb5ec905fa324523a36723f625b496b8e22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          filter: 'tree:0'

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format notify crate
        run: cargo fmt --manifest-path tools/notify/Cargo.toml -- --check

      - name: Clippy notify crate
        run: cargo clippy --locked -p notify --all-targets -- -D warnings

      - name: Test notify crate
        run: cargo test --locked -p notify --all-targets
