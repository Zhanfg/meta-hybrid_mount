name: VFS rustfmt once

on:
  push:
    branches:
      - 'integration/vfs-nomount-20260809'
    paths:
      - '.github/workflows/vfs-format-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  format-once:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zhanfg/meta-hybrid_mount-ci@sha256:c7df09521257f5b5e78e20ffa4928eb5ec905fa324523a36723f625b496b8e22
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/vfs-nomount-20260809
          fetch-depth: 0
      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit rustfmt output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src; then
            echo "No rustfmt changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "style: rustfmt VFS hardening"
          git push origin HEAD:integration/vfs-nomount-20260809
