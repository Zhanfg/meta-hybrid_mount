name: privileged-mount-validation

on:
  push:
    branches:
      - 'validation/**'
    paths:
      - 'src/mount/magic_mount/**'
      - 'src/mount/umount_mgr.rs'
      - '.github/workflows/privileged-mount-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  magic-mount-namespace:
    name: Magic Mount private namespace
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Build privileged library test
        shell: bash
        run: |
          set -euo pipefail
          cargo test --lib \
            privileged_magic_mount_excludes_temporary_worktree_from_unmount_registration \
            --no-run \
            --message-format=json \
            > cargo-test-artifacts.jsonl

          TEST_BINARY="$(python3 - <<'PY'
          import json
          from pathlib import Path

          executable = None
          for raw_line in Path('cargo-test-artifacts.jsonl').read_text().splitlines():
              try:
                  message = json.loads(raw_line)
              except json.JSONDecodeError:
                  continue
              if message.get('reason') != 'compiler-artifact':
                  continue
              if not message.get('profile', {}).get('test'):
                  continue
              if 'lib' not in message.get('target', {}).get('kind', []):
                  continue
              candidate = message.get('executable')
              if candidate:
                  executable = candidate

          if not executable:
              raise SystemExit('Cargo did not report the library test executable')
          print(executable)
          PY
          )"
          test -n "$TEST_BINARY"
          test -x "$TEST_BINARY"
          printf 'TEST_BINARY=%s\n' "$TEST_BINARY" >> "$GITHUB_ENV"

      - name: Run real mounts in isolated namespace
        shell: bash
        run: |
          set -euo pipefail
          sudo unshare --mount --propagation private -- \
            "$TEST_BINARY" \
            privileged_magic_mount_excludes_temporary_worktree_from_unmount_registration \
            --ignored \
            --nocapture \
            --exact \
            --test-threads=1
