name: privileged-mount-validation

on:
  push:
    branches:
      - 'validation/**'
    paths:
      - 'src/mount/magic_mount/**'
      - 'src/mount/umount_mgr.rs'
      - 'tests/privileged_magic_failure.rs'
      - '.github/workflows/privileged-mount-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  magic-mount-namespace:
    name: Magic Mount private namespace
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Build privileged tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --lib \
            privileged_magic_mount_excludes_temporary_worktree_from_unmount_registration \
            --no-run \
            --message-format=json \
            > cargo-lib-test-artifacts.jsonl
          cargo test --test privileged_magic_failure \
            --no-run \
            --message-format=json \
            > cargo-failure-test-artifacts.jsonl

          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          def find_executable(path: str, *, target_name: str | None = None, require_lib: bool = False) -> str:
              executable = None
              for raw_line in Path(path).read_text().splitlines():
                  try:
                      message = json.loads(raw_line)
                  except json.JSONDecodeError:
                      continue
                  if message.get('reason') != 'compiler-artifact':
                      continue
                  if not message.get('profile', {}).get('test'):
                      continue
                  target = message.get('target', {})
                  if require_lib and 'lib' not in target.get('kind', []):
                      continue
                  if target_name is not None and target.get('name') != target_name:
                      continue
                  candidate = message.get('executable')
                  if candidate:
                      executable = candidate
              if not executable:
                  raise SystemExit(f'Cargo did not report the requested test executable from {path}')
              return executable

          print(f"LIB_TEST_BINARY={find_executable('cargo-lib-test-artifacts.jsonl', require_lib=True)}")
          print(
              'FAILURE_TEST_BINARY='
              + find_executable(
                  'cargo-failure-test-artifacts.jsonl',
                  target_name='privileged_magic_failure',
              )
          )
          PY

      - name: Validate final unmount registration
        shell: bash
        run: |
          set -euo pipefail
          test -x "$LIB_TEST_BINARY"
          VALIDATION_OUTPUT="$(
            sudo unshare --mount --propagation private -- \
              "$LIB_TEST_BINARY" \
              privileged_magic_mount_excludes_temporary_worktree_from_unmount_registration \
              --ignored \
              --nocapture \
              --test-threads=1 \
              2>&1
          )"
          printf '%s\n' "$VALIDATION_OUTPUT"
          grep -F 'running 1 test' <<< "$VALIDATION_OUTPUT"
          grep -F 'test result: ok. 1 passed; 0 failed' <<< "$VALIDATION_OUTPUT"

      - name: Validate failure cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -x "$FAILURE_TEST_BINARY"
          VALIDATION_OUTPUT="$(
            sudo unshare --mount --propagation private -- \
              "$FAILURE_TEST_BINARY" \
              privileged_magic_mount_cleans_workspace_after_metadata_failure \
              --ignored \
              --nocapture \
              --test-threads=1 \
              2>&1
          )"
          printf '%s\n' "$VALIDATION_OUTPUT"
          grep -F 'running 1 test' <<< "$VALIDATION_OUTPUT"
          grep -F 'test result: ok. 1 passed; 0 failed' <<< "$VALIDATION_OUTPUT"
