name: Retry Review Round 2

on:
  push:
    branches:
      - 'review/triple-code-review'
    paths:
      - '.github/workflows/retry-review-round2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: review/triple-code-review
          fetch-depth: 0

      - name: Apply and verify reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_review_round2.py
          python3 .github/scripts/apply_review_round2_followup.py
          cargo fmt --all
          git diff --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo test -p hybrid-mount --no-default-features --features control-plane --lib
          cargo test -p hybrid-mount --no-default-features --lib
          cd webui
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run test

      - name: Commit round-two fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/ops/plan.rs src/core/storage/mod.rs src/core/kasumi_coordinator.rs src/core/controller.rs src/core/startup/mod.rs src/core/ops/executor/mod.rs src/sys/lkm.rs webui/src/lib/types.ts webui/src/lib/api.mock.ts webui/src/routes/KasumiTab/LkmSection.tsx
          git commit -m 'fix: make Kasumi execution transactional and downgrade locally'
          git push origin HEAD:review/triple-code-review
