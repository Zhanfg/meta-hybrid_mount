name: Retry Review Round 2

on:
  push:
    branches:
      - 'review/triple-code-review'
    paths:
      - '.github/workflows/retry-review-round2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: review/triple-code-review
          fetch-depth: 0

      - name: Extract and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import textwrap
          from pathlib import Path

          lines = Path('.github/workflows/apply-review-round2.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "python3 - <<'PY'") + 1
          end = next(index for index in range(start, len(lines)) if lines[index].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start:end])) + '\n'
          Path('/tmp/apply_round2.py').write_text(script)
          PY

          python3 /tmp/apply_round2.py
          cargo fmt --all
          git diff --check
          cargo test --workspace --all-features
          cargo test -p hybrid-mount --no-default-features --features control-plane --lib
          cargo test -p hybrid-mount --no-default-features --lib
          cd webui
          corepack enable
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run test

      - name: Commit round-two fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/ops/plan.rs src/core/storage/mod.rs src/core/kasumi_coordinator.rs src/core/controller.rs src/mount/kasumi/runtime.rs src/core/ops/executor/mod.rs src/sys/lkm.rs webui/src/lib/types.ts webui/src/routes/KasumiTab/LkmSection.tsx
          git commit -m 'fix: make Kasumi execution transactional and downgrade locally'
          git push origin HEAD:review/triple-code-review
