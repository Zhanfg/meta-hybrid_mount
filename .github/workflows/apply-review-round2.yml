name: Apply Review Round 2 Fixes

on:
  push:
    branches:
      - 'review/triple-code-review'
    paths:
      - '.github/workflows/apply-review-round2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: review/triple-code-review
          fetch-depth: 0

      - name: Apply transaction and downgrade fixes
        shell: bash
