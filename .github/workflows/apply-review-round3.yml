name: Apply Review Round 3 Fixes

on:
  push:
    branches:
      - 'review/triple-code-review'
    paths:
      - '.github/workflows/apply-review-round3.yml'

permissions:
  contents: write
  packages: read

jobs:
  apply:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zhanfg/meta-hybrid_mount-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: review/triple-code-review
          fetch-depth: 0

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Apply and verify third-review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_review_round3.py
          cargo fmt --all
          git diff --check
          bash scripts/check-kasumi-uapi-compat.sh
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy -p hybrid-mount --no-default-features --features control-plane --lib -- -D warnings
          cargo clippy -p hybrid-mount --no-default-features --lib -- -D warnings
          cargo test --workspace --all-features
          cargo test -p hybrid-mount --no-default-features --features control-plane --lib
          cargo test -p hybrid-mount --no-default-features --lib
          cd webui
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run test

      - name: Commit third-review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/ops/executor/overlay.rs src/mount/magic_mount/mod.rs src/mount/custom_bind.rs src/core/runtime_finalization.rs src/core/controller.rs
          git commit -m 'fix: prevent post-mount bookkeeping failures from aborting boot'
          git push origin HEAD:review/triple-code-review
